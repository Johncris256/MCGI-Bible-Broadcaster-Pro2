name: V2 hardening helper tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  security-helper-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test V2 security helpers
        run: node --test tools/bible-broadcast-live-v2-hardening-pack/test/security.test.js
