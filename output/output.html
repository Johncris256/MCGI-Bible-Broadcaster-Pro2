<script id="PRISTINE_LAN_OUTPUT_RECEIVER">
  (function() {
    const registeredChannels = new Set();
    const seenMsgIds = new Set();

    const persistentHighlights = { 0: new Set(), 1: new Set(), 2: new Set(), 3: new Set() };
    const slotVerseSignatures = ['', '', '', ''];

    function getVisibleBoxes() {
      const stage = document.getElementById('multiSlotStage') || document.body;
      return Array.from(stage.querySelectorAll('.render-box, [id*="slot"], [class*="slot"]')).filter(b => {
        const s = window.getComputedStyle(b);
        return s.display !== 'none' && s.opacity !== '0';
      });
    }

    function reapplyPersistentHighlights() {
      const boxes = getVisibleBoxes();
      boxes.forEach((box, sIdx) => {
        if (sIdx > 3) return;

        const textEl = box.querySelector('.verse-text, [class*="verse"], p');
        const words = textEl ? Array.from(textEl.querySelectorAll('.ndi-word, span')).filter(w => w.innerText.trim()) : [];
        
        // PURE VERSE WORDS FINGERPRINT (Walang kinalaman ang focus o title)
        const wordsSig = words.slice(0, 15).map(w => w.innerText.trim().toLowerCase()).join(' ');

        if (wordsSig) {
          // Kung talagang NAGBAGO ang mga salita ng talata:
          if (slotVerseSignatures[sIdx] !== wordsSig) {
            slotVerseSignatures[sIdx] = wordsSig;
            persistentHighlights[sIdx].clear();
          } else {
            // Kung PAREHO ang mga salita: Panatilihin ang highlights kahit nagbago ang focus!
            if (persistentHighlights[sIdx].size > 0) {
              words.forEach((w, wIdx) => {
                if (persistentHighlights[sIdx].has(wIdx)) {
                  w.classList.add('active-highlight');
                }
              });
            }
          }
        }
      });
    }

    const OrigBC = window.BroadcastChannel;
    window.BroadcastChannel = function(name) {
      const instance = new OrigBC(name);
      registeredChannels.add(instance);
      instance.addEventListener('message', function(ev) {
        if (ev.data && ev.data.__msgId) seenMsgIds.add(ev.data.__msgId);
      });
      return instance;
    };
    window.BroadcastChannel.prototype = OrigBC.prototype;

    const es = new EventSource('/api/output-stream');
    es.onmessage = function(e) {
      if (!e.data) return;
      try {
        const msg = JSON.parse(e.data);
        if (msg.__msgId) {
          if (seenMsgIds.has(msg.__msgId)) return;
          seenMsgIds.add(msg.__msgId);
        }

        if (msg.type === 'SET_SLOT_HIGHLIGHT') {
          const sIdx = msg.slotIndex;
          if (msg.isHighlighted) {
            persistentHighlights[sIdx].add(msg.wordIndex);
          } else {
            persistentHighlights[sIdx].delete(msg.wordIndex);
          }

          const boxes = getVisibleBoxes();
          const targetBox = boxes[sIdx];
          if (targetBox) {
            const words = Array.from(targetBox.querySelectorAll('.ndi-word, span')).filter(w => w.innerText.trim());
            if (words[msg.wordIndex]) {
              words[msg.wordIndex].classList.toggle('active-highlight', !!msg.isHighlighted);
            }
          }
          return;
        }

        if (msg.type === 'CLEAR_ALL_HIGHLIGHTS' || msg.type === 'CLEAR_HIGHLIGHTS') {
          for (let i = 0; i < 4; i++) persistentHighlights[i].clear();
          const stage = document.getElementById('multiSlotStage') || document.body;
          stage.querySelectorAll('.active-highlight').forEach(el => {
            el.classList.remove('active-highlight');
            el.removeAttribute('data-highlighted');
          });
          return;
        }

        registeredChannels.forEach(ch => {
          const ev = new MessageEvent('message', { data: msg });
          if (typeof ch.onmessage === 'function') {
            try { ch.onmessage(ev); } catch(err) {}
          }
          try { ch.dispatchEvent(ev); } catch(err) {}
        });

        setTimeout(reapplyPersistentHighlights, 40);
        setTimeout(reapplyPersistentHighlights, 120);
      } catch(err) {}
    };

    window.addEventListener('DOMContentLoaded', () => {
      const stage = document.getElementById('multiSlotStage') || document.body;
      const obs = new MutationObserver(() => {
        reapplyPersistentHighlights();
      });
      obs.observe(stage, { childList: true, subtree: true });
    });
  })();
</script>

<script id="STABLE_OUTPUT_RECEIVER">
  (function() {
    function hexToRgba(hex, alpha) {
      let c = (hex || '#ffd700').replace('#', '');
      if (c.length === 3) c = c.split('').map(x => x + x).join('');
      const num = parseInt(c, 16);
      return 'rgba(' + ((num >> 16) & 255) + ',' + ((num >> 8) & 255) + ',' + (num & 255) + ',' + alpha + ')';
    }

    function applyConfig(mode, fCol, bCol, op, rad) {
      document.documentElement.setAttribute('data-hl-mode', mode || 'karaoke');
      document.documentElement.style.setProperty('--hl-font-color', fCol || '#ffd700');
      document.documentElement.style.setProperty('--hl-box-rgba', hexToRgba(bCol || '#ffd700', op || 0.85));
      document.documentElement.style.setProperty('--hl-corner-radius', (rad || 6) + 'px');
    }

    const savedMode = localStorage.getItem('hl_preset_mode') || 'karaoke';
    const savedFont = localStorage.getItem('hl_font_color') || '#ffd700';
    const savedBox = localStorage.getItem('hl_box_color') || '#ffd700';
    const savedOp = localStorage.getItem('hl_box_opacity') || 0.85;
    const savedRad = localStorage.getItem('hl_corner_radius') || 6;
    applyConfig(savedMode, savedFont, savedBox, savedOp, savedRad);

    try {
      const bc = new BroadcastChannel('bible_projection_channel');
      bc.onmessage = function(ev) {
        if (!ev.data) return;
        if (ev.data.type === 'UPDATE_HIGHLIGHT_CONFIG') {
          applyConfig(ev.data.presetMode, ev.data.fontColor, ev.data.boxColor, ev.data.boxOpacity, ev.data.cornerRadius);
        } else if (typeof ev.data.hideVerseBox !== 'undefined') {
          document.body.classList.toggle('hide-verse-box-active', !!ev.data.hideVerseBox);
        }
      };
    } catch(e) {}

    window.addEventListener('storage', function() {
      const mode = localStorage.getItem('hl_preset_mode') || 'karaoke';
      const fontColor = localStorage.getItem('hl_font_color') || '#ffd700';
      const boxColor = localStorage.getItem('hl_box_color') || '#ffd700';
      const op = localStorage.getItem('hl_box_opacity') || 0.85;
      const rad = localStorage.getItem('hl_corner_radius') || 6;
      applyConfig(mode, fontColor, boxColor, op, rad);
    });
  })();
</script>

<style id="SPLIT-CANVAS-ZOOM-16x9">

     whole canvas down uniformly; the reference, version, verse, padding and
     card shape therefore keep their proportions. */

    display: grid !important;
    gap: 18px !important;
    position: relative !important;
    margin: 0 !important;
    aspect-ratio: 16 / 9 !important;

    grid-template-rows: minmax(0, 1fr) !important;

    grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
    grid-template-rows: minmax(0, 1fr) !important;

    grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
    grid-template-rows: repeat(2, minmax(0, 1fr)) !important;

  #multiSlotStage > .render-box {

  #multiSlotStage .slot-canvas {

    display: flex !important;
    flex-direction: column !important;

  #multiSlotStage > .render-box.transparent-verse-box .slot-canvas {
    background: transparent !important;

    width: 100% !important;
    max-width: 100% !important;
    line-height: 1.55 !important;
    overflow: hidden !important;
  }

  /* 1 Full, 3-Split and 4-Grid anchored vertical zoom:
     treat the full 3-card composition as one frame. The top edge stays pinned;
     Zoom Y only expands/compresses content below that top edge. */
  #multiSlotStage.mode-1,
  #multiSlotStage.mode-3,
  #multiSlotStage.mode-4 {
    /* Treat each layout as one frame: pin its top edge and scale downward. */
    transform: translate3d(0, var(--slot-pan-y, 0px), 0) scaleY(var(--slot-zoom-y, 1)) !important;
    transform-origin: 50% 0% !important;
  }
  #multiSlotStage.mode-1 .slot-canvas,
  #multiSlotStage.mode-3 .slot-canvas,
  #multiSlotStage.mode-4 .slot-canvas {
    /* Keep each card's own fit; apply vertical Zoom Y only once to the whole frame. */
    transform: scale(var(--slot-scale, 1)) !important;
  }

</style>

<style id="ALL-MODE-PROPORTIONAL-TEXT">
  /* Keep reference and translation labels fixed in size and anchored at the
     upper-left of each Verse Box, independent of Zoom Y. */

  #multiSlotStage.mode-2 .reference-text-guard,
  #multiSlotStage.mode-3 .reference-text-guard,

    transform-origin: top left !important;
    width: 100%;
    min-width: 0;
  }

  /* Keep verse glyphs proportional in every layout. Below 100% Zoom Y, the
     JS fit calculation reduces font-size uniformly before this Y compensation. */
  #multiSlotStage.mode-1 .verse-text-guard,
  #multiSlotStage.mode-2 .verse-text-guard,
  #multiSlotStage.mode-3 .verse-text-guard,
  #multiSlotStage.mode-4 .verse-text-guard {
    transform: scaleY(var(--slot-zoom-y-inverse, 1)) !important;
    transform-origin: top center !important;
    width: 100%;
    max-width: 100%;
    min-width: 0;
  }
</style>
