<script>
/* LIVE-MEMORY-CLIENT-SYNC */
(function() {
  const origSetItem = Storage.prototype.setItem;
  let pendingBatch = {};
  let sendTimer = null;

  // 1. HYDRATE ONCE: Pagka-bukas o pag-refresh lang ng page kukunin ang Server Memory!
  window.addEventListener('DOMContentLoaded', () => {
    fetch('/api/live-session')
      .then(r => r.json())
      .then(session => {
        if (!session || !session.localStorageBackup) return;
        window.__APPLYING_REMOTE_STORAGE__ = true;
        let lastKey = null, lastVal = null;
        for (const [k, v] of Object.entries(session.localStorageBackup)) {
          if (localStorage.getItem(k) !== v) {
            try { origSetItem.call(localStorage, k, v); } catch (e) {}
            lastKey = k;
            lastVal = v;
          }
        }
        if (lastKey !== null) {
          window.dispatchEvent(new StorageEvent('storage', {
            key: lastKey,
            newValue: lastVal,
            storageArea: window.localStorage
          }));
        }
        window.__APPLYING_REMOTE_STORAGE__ = false;
      })
      .catch(() => {});
  });

  // 2. WRITE-BEHIND: Tahimik na i-save sa Server Memory ang iniwan ng Operator
  // Walang pabalik na SSE StorageEvent loop para hindi mag-double trigger ang animations!
  Storage.prototype.setItem = function(key, value) {
    const strVal = String(value);
    const prevVal = this.getItem(key);
    origSetItem.apply(this, arguments);

    if (this === window.localStorage && !window.__APPLYING_REMOTE_STORAGE__) {
      if (prevVal === strVal) return;
      pendingBatch[key] = strVal;
      clearTimeout(sendTimer);
      sendTimer = setTimeout(() => {
        const batchToSend = pendingBatch;
        pendingBatch = {};
        fetch('/api/live-session', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ batch: batchToSend })
        }).catch(() => {});
      }, 100);
    }
  };
})();
</script>

<script>
/* WEB-LINK-INTERCEPTOR */
(function() {
  const cleanUrl = (u) => {
    if (typeof u !== 'string') return u;
    return u
      .replace(/^https?:\/\/(localhost|127\.0\.0\.1):3300/i, window.location.origin)
      .replace(/^https?:\/\/[^/]+:3300/i, window.location.origin);
  };
  const origFetch = window.fetch;
  window.fetch = function(input, init) {
    if (typeof input === 'string') input = cleanUrl(input);
    return origFetch.call(this, input, init);
  };
  const OrigWS = window.WebSocket;
  window.WebSocket = function(url, protocols) {
    if (typeof url === 'string') {
      const wsProto = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
      url = url
        .replace(/^wss?:\/\/(localhost|127\.0\.0\.1):3300/i, wsProto + window.location.host)
        .replace(/^wss?:\/\/[^/]+:3300/i, wsProto + window.location.host);
      if (window.location.protocol === 'https:' && url.startsWith('ws://')) {
        url = 'wss://' + url.slice(5);
      }
    }
    return protocols ? new OrigWS(url, protocols) : new OrigWS(url);
  };
  window.WebSocket.prototype = OrigWS.prototype;
  window.WebSocket.OPEN = OrigWS.OPEN;
  window.WebSocket.CLOSED = OrigWS.CLOSED;
})();
</script>

<script id="MCGI_DISABLE_NATIVE_CONTEXT_MENU_V8">
(function () {
  'use strict';

  // Block right-click and long-press browser context menus globally.
  // Do not cancel pointerdown/pointermove: Highlighter's own tap and
  // press-and-hold drag-to-highlight gesture must keep working.
  function suppressNativeContextMenu(event) {
    if (event && event.cancelable) event.preventDefault();
    if (event && typeof event.stopImmediatePropagation === 'function') {
      event.stopImmediatePropagation();
    }
    if (event && typeof event.stopPropagation === 'function') event.stopPropagation();
    return false;
  }

  window.addEventListener('contextmenu', suppressNativeContextMenu, true);
  document.addEventListener('contextmenu', suppressNativeContextMenu, true);

  // Keep the page from entering native text-selection or image/element drag mode.
  document.addEventListener('selectstart', suppressNativeContextMenu, true);
  document.addEventListener('dragstart', suppressNativeContextMenu, true);
})();
</script>

  <style>
    :root {

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      min-height: 0;
      overflow: hidden !important;
      overscroll-behavior: none;

    #mirrorViewport {

    #multiSlotStage {
      display: grid;
      gap: 18px;
      width: 100%;
      height: 100%;
      min-height: 0;
      min-width: 0;
      transition: width 0.2s ease, height 0.2s ease;

    #multiSlotStage.mode-1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
    #multiSlotStage.mode-2 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
    /* 3-Split Pyramid Layout: 2 on top, 1 centered at the bottom */
    #multiSlotStage.mode-3 {
      grid-template-columns: 1fr 1fr !important;
      grid-template-rows: 1fr 1fr !important;
    }
    #multiSlotStage.mode-3 > .render-box:nth-child(3) {
      grid-column: 1 / -1 !important;
      width: calc(50% - 9px) !important;
      justify-self: center !important;

    #multiSlotStage.mode-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }

    .render-box {

      height: 100%;

      justify-content: space-between;

    .reference-title {

      color: #ffffff;
      text-transform: uppercase;

    .version-subtitle {

        document.body.dataset.deviceProfile = valid;
        try { saveProfile(valid); } catch (e) {}
        profileButton.textContent = 'Device: ' + (valid === 'pc' ? 'PC' : valid === 'tablet' ? 'Tablet' : 'Phone');
        requestAnimationFrame(() => { if (lastOutputData) renderMirrorState(lastOutputData); });
      }
      function openDevicePicker() { picker.classList.add('open'); }
      picker.querySelectorAll('[data-profile]').forEach(button => {
        button.addEventListener('click', () => {
          applyDeviceProfile(button.dataset.profile);
          picker.classList.remove('open');
        });
      });
      profileButton.addEventListener('click', openDevicePicker);
      let savedProfile = null;
      try { savedProfile = readSavedProfile(); } catch (e) {}
      if (savedProfile) applyDeviceProfile(savedProfile);
      else openDevicePicker();

      function setWordHighlight(slotIdx, wordIdx, highlighted) {
        const set = persistentHighlights[slotIdx];
        const had = set.has(wordIdx);
        if (highlighted) set.add(wordIdx); else set.delete(wordIdx);
        if (had === highlighted) return;
        const box = stage.children[slotIdx];
        if (box) updateWordVisuals(box, slotIdx);
        sendHighlightAction(slotIdx, wordIdx, highlighted);
      }

      function activateHoldDrag() {
        if (!isPointerDown || !dragStartPoint || dragHoldActivated) return;
        dragHoldActivated = true;
        const { slotIdx, wordIdx } = dragStartPoint;
        dragTargetHighlightState = !persistentHighlights[slotIdx].has(wordIdx);
        dragLastWordIndex = wordIdx;
        setWordHighlight(slotIdx, wordIdx, dragTargetHighlightState);
      }

      function finishPointerGesture() {
        if (dragHoldTimer) clearTimeout(dragHoldTimer);
        dragHoldTimer = null;
        isPointerDown = false;
        activeDragSlot = null;
        dragLastWordIndex = null;
        dragStartPoint = null;
        dragHoldActivated = false;
        activePointerId = null;
      }

      document.addEventListener('pointerup', finishPointerGesture, { passive: true });
      document.addEventListener('pointercancel', finishPointerGesture, { passive: true });

      let bcLive = null;
      try {
        bcLive = new BroadcastChannel('bible_live_stream');
      } catch (e) {}

      function sendHighlightAction(slotIdx, wordIdx, isHighlighted) {
        const payload = {
          type: 'SET_SLOT_HIGHLIGHT',
          slotIndex: slotIdx,
          wordIndex: wordIdx,
          isHighlighted: isHighlighted,
          __msgId: Date.now() + '_' + Math.random().toString(36).substr(2, 7)
        };

        fetch('/api/output-broadcast', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        }).catch(() => {});

        fetch('/api/pastor-tap', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        }).catch(() => {});

        // I-sync pabalik sa localStorage payload para hindi ma-overwrite ng Operator
        syncHighlightsToStorage();
      }

      function syncHighlightsToStorage() {
        try {
          const raw = localStorage.getItem('bible_live_payload');
          if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed.slots)) {
              for (let i = 0; i < 4; i++) {
                if (parsed.slots[i]) {
                  parsed.slots[i].highlighted = Array.from(persistentHighlights[i]);
                }
              }
              if (parsed.slots[0]) parsed.highlighted = parsed.slots[0].highlighted;
              localStorage.setItem('bible_live_payload', JSON.stringify(parsed));
              localStorage.setItem('bible_live_timestamp', String(Date.now()));
              if (bcLive) bcLive.postMessage(parsed);
            }
          }
        } catch (e) {}
      }

      // Re-broadcast ang lahat ng active highlights sa Output kapag nagpalit ng Display Mode
      function rebroadcastActiveHighlights(visibleCount) {
        for (let sIdx = 0; sIdx < visibleCount; sIdx++) {
          persistentHighlights[sIdx].forEach(wIdx => {
            const payload = {
              type: 'SET_SLOT_HIGHLIGHT',
              slotIndex: sIdx,
              wordIndex: wIdx,
              isHighlighted: true,
              __msgId: Date.now() + '_reb_' + sIdx + '_' + wIdx + '_' + Math.random().toString(36).substr(2, 4)
            };
            fetch('/api/output-broadcast', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            }).catch(() => {});
          });
        }
        syncHighlightsToStorage();
      }

      // High-DPI raster renderer. The transparent DOM text remains above the
      // canvas for accurate per-word hit testing; only the visible glyphs are
      // painted into the canvas, so the verse stays sharp at any device scale.
      function paintRasterVerse(boxEl, sIdx) {
        if (!boxEl) return;
        const canvas = boxEl.querySelector('.verse-raster-canvas');
        const guard = boxEl.querySelector('.verse-text-guard');
        const textEl = boxEl.querySelector('.verse-text');
        if (!canvas || !guard || !textEl) return;

        const width = Math.max(1, guard.clientWidth);
        const height = Math.max(1, guard.clientHeight);
        const fittedScale = Number.parseFloat(document.getElementById('mirrorViewport')?.style.getPropertyValue('--hl-frame-scale')) || 1;
        const dpr = Math.max(1, Math.min(2, (window.devicePixelRatio || 1) * fittedScale));
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        const pixelWidth = Math.max(1, Math.round(width * dpr));
        const pixelHeight = Math.max(1, Math.round(height * dpr));
        if (canvas.width !== pixelWidth) canvas.width = pixelWidth;
        if (canvas.height !== pixelHeight) canvas.height = pixelHeight;

        const ctx = canvas.getContext('2d');
        if (!ctx) {
          textEl.classList.add('raster-fallback');
          canvas.style.display = 'none';
          return;
        }
        textEl.classList.remove('raster-fallback');
        canvas.style.display = 'block';

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, width, height);
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';

        const guardRect = guard.getBoundingClientRect();
        const scaleX = guard.offsetWidth ? (guardRect.width / guard.offsetWidth) || 1 : 1;
        const scaleY = guard.offsetHeight ? (guardRect.height / guard.offsetHeight) || 1 : 1;
        const mode = document.body.dataset.hlMode || 'karaoke';
        const words = textEl.querySelectorAll('.ndi-word');
        let rasterWordsDrawn = 0;

        words.forEach(wordEl => {
          const word = wordEl.textContent || '';
          if (!word) return;
          const style = window.getComputedStyle(wordEl);
          const fontSize = style.fontSize || '24px';
          const fontFamily = style.fontFamily || 'Arial, Helvetica, sans-serif';
          const fontWeight = style.fontWeight || '700';
          const fontStyle = style.fontStyle || 'normal';
          ctx.font = `${fontStyle} ${fontWeight} ${fontSize} ${fontFamily}`;

          const active = wordEl.classList.contains('active-highlight');
          const rects = Array.from(wordEl.getClientRects());
          const paddingLeft = parseFloat(style.paddingLeft) || 0;
          const paddingRight = parseFloat(style.paddingRight) || 0;

          rects.forEach(rect => {
            const x = (rect.left - guardRect.left) / scaleX;
            const y = (rect.top - guardRect.top) / scaleY;
            const w = rect.width / scaleX;
            const h = rect.height / scaleY;
            if (w <= 0 || h <= 0) return;

            if (active && mode === 'box') {
              ctx.save();
              ctx.fillStyle = getComputedStyle(document.documentElement)
                .getPropertyValue('--hl-box-rgba').trim() || 'rgba(250, 204, 21, 0.88)';
              const radius = Math.min(4, h / 5);
              ctx.beginPath();
              if (typeof ctx.roundRect === 'function') {
                ctx.roundRect(x, y + 1, w, Math.max(1, h - 2), radius);
              } else {
                ctx.rect(x, y + 1, w, Math.max(1, h - 2));
              }
              ctx.fill();
              ctx.restore();
            } else if (active) {
              ctx.save();
              ctx.fillStyle = 'rgba(255, 215, 0, 0.15)';
              ctx.fillRect(x, y + 1, w, Math.max(1, h - 2));
              ctx.fillStyle = '#ffd700';
              ctx.fillRect(x, y + h - 3, w, 3);
              ctx.restore();
            }

            ctx.save();
            if (active && mode === 'karaoke') {
              ctx.fillStyle = '#ffd700';
              ctx.shadowColor = '#ffd700';
              ctx.shadowBlur = 8;
            } else {
              ctx.fillStyle = '#ffffff';
              ctx.shadowColor = 'rgba(0,0,0,0.9)';
              ctx.shadowBlur = 4;
            }
            ctx.shadowOffsetX = 1;
            ctx.shadowOffsetY = 2;
            const drawX = x + paddingLeft;
            const letterSpacing = Number.parseFloat(style.letterSpacing) || 0;
            let nativeLetterSpacing = false;
            try {
              nativeLetterSpacing = ('letterSpacing' in ctx);
              if (nativeLetterSpacing) ctx.letterSpacing = letterSpacing + 'px';
            } catch (e) { nativeLetterSpacing = false; }

            if (nativeLetterSpacing || letterSpacing === 0) {
              ctx.fillText(word, drawX, y + h / 2);
            } else {
              // Fallback for browsers without CanvasRenderingContext2D.letterSpacing.
              // Segment by grapheme so accented/combined characters stay intact.
              const parts = (typeof Intl !== 'undefined' && Intl.Segmenter)
                ? Array.from(new Intl.Segmenter(undefined, { granularity: 'grapheme' }).segment(word), part => part.segment)
                : Array.from(word);
              let charX = drawX;
              parts.forEach(part => {
                ctx.fillText(part, charX, y + h / 2);
                charX += ctx.measureText(part).width + letterSpacing;
              });
            }
            if (nativeLetterSpacing) {
              try { ctx.letterSpacing = '0px'; } catch (e) {}
            }
            rasterWordsDrawn++;
            ctx.restore();
          });
        });

        if (rasterWordsDrawn === 0) {
          // Never leave the verse invisible. Keep interactive DOM text visible
          // until the canvas can measure and paint its words successfully.
          textEl.classList.add('raster-fallback');
          canvas.style.display = 'none';
        } else {
          textEl.classList.remove('raster-fallback');
          canvas.style.display = 'block';
        }
      }

      function scheduleRasterPaint(boxEl, sIdx) {
        if (!boxEl) return;
        const canvas = boxEl.querySelector('.verse-raster-canvas');
        if (canvas && canvas._rasterFrame) cancelAnimationFrame(canvas._rasterFrame);
        if (!canvas) return;
        canvas._rasterFrame = requestAnimationFrame(() => {
          canvas._rasterFrame = 0;
          paintRasterVerse(boxEl, sIdx);
        });
      }

      function updateWordVisuals(boxEl, sIdx) {
        if (!boxEl) return;
        const words = boxEl.querySelectorAll('.ndi-word');
        const spaces = boxEl.querySelectorAll('.ndi-space');
        const highSet = persistentHighlights[sIdx];

        words.forEach((w, idx) => {
          w.classList.toggle('active-highlight', highSet.has(idx));
        });
        spaces.forEach((sp) => {
          const idx = parseInt(sp.dataset.spaceAfter, 10);
          sp.classList.toggle('active-highlight', highSet.has(idx) && highSet.has(idx + 1));
        });
        scheduleRasterPaint(boxEl, sIdx);
      }

      function getOutputTextSpacing(settings, displayMode) {
        const allModes = (settings && settings.modeAdjustments) || {};
        const activeMode = allModes[displayMode] || {};
        // Output uses 1-Full composition typography for every split/grid mode.
        const composition = displayMode === 1 ? activeMode : (allModes[1] || {});
        const clamp = (value, fallback, min, max, decimals) => {
          const number = Number(value);
          return Number.isFinite(number)
            ? Number(Math.min(max, Math.max(min, number)).toFixed(decimals))
            : fallback;
        };
        return {
          letterSpacing: clamp(composition.letterSpacing, -1.0, -2, 10, 1),
          lineSpacing: clamp(composition.lineSpacing, 1.20, 0.8, 2.5, 2)
        };
      }

      function adjustMirrorFontSize(boxEl, baseMaxSize, displayMode, fontsObj, textSpacing) {
        const container = boxEl.querySelector('.verse-container');
        const text = boxEl.querySelector('.verse-text');
        const refTitle = boxEl.querySelector('.reference-title');
        const verSub = boxEl.querySelector('.version-subtitle');
        const reference = boxEl.querySelector('.reference-container');
        if (!container || !text) return;

        // HIGHLIGHTER-ONLY HEADER DEFAULTS.
        // Keep these sizes independent of Output typography and device orientation.
        // Genesis reference = 30px; translation label = 15px on every Highlighter layout.
        const refSize = 30;
        const verSize = 15;
        if (refTitle) {
          refTitle.style.setProperty('font-size', refSize + 'px', 'important');
          refTitle.style.setProperty('line-height', '1.04', 'important');
        }
        if (verSub) {
          verSub.style.setProperty('font-size', verSize + 'px', 'important');
          verSub.style.setProperty('line-height', '1.06', 'important');
        }

        // Match Output's active composition spacing. Defaults are -1.0px / 1.20
        // when no Operator spacing has been saved; this also keeps DOM hit boxes
        // aligned with the raster glyphs and Output's line wrapping.
        const spacing = textSpacing || { letterSpacing: -1.0, lineSpacing: 1.20 };
        const effectiveLetterSpacing = Number.isFinite(Number(spacing.letterSpacing)) ? Number(spacing.letterSpacing) : -1.0;
        const effectiveLineSpacing = Number.isFinite(Number(spacing.lineSpacing)) ? Number(spacing.lineSpacing) : 1.20;
        text.style.setProperty('letter-spacing', effectiveLetterSpacing.toFixed(1) + 'px', 'important');
        text.style.setProperty('line-height', String(effectiveLineSpacing), 'important');
        // Clear stale fit state before measuring. Include every geometry-affecting
        // property so an orientation or layout change always triggers a new fit.
        text.style.width = '100%';
        text.style.maxHeight = 'none';
        text.style.overflow = 'visible';

        const usableWidth = Math.max(1, container.clientWidth);
        const usableHeight = Math.max(1, container.clientHeight);
        const key = [
          text.dataset.verseKey || '', displayMode, Number(baseMaxSize) || 100,
          refSize.toFixed(2), verSize.toFixed(2), effectiveLetterSpacing.toFixed(1),
          effectiveLineSpacing.toFixed(2), usableWidth, usableHeight,
          window.innerWidth, window.innerHeight, document.body.dataset.deviceProfile || ''
        ].join('|');
        if (text.dataset.fontFitKey === key && text.dataset.fittedFontSize) return;
        text.style.fontSize = '';

        const maxSize = Math.max(12, Math.min(100, Number(baseMaxSize) || 100));
        let low = 10;
        let high = Math.floor(maxSize);
        let best = low;
        while (low <= high) {
          const mid = Math.floor((low + high) / 2);
          text.style.fontSize = mid + 'px';
          const fitsHeight = text.scrollHeight <= usableHeight + 1;
          const fitsWidth = text.scrollWidth <= usableWidth + 1;
          if (fitsHeight && fitsWidth) {
            best = mid;
            low = mid + 1;
          } else {
            high = mid - 1;
          }
        }
        text.style.fontSize = best + 'px';
        text.style.maxHeight = 'none';
        text.style.overflow = 'visible';
        text.dataset.fittedFontSize = String(best);
        text.dataset.fontFitKey = key;

        // Keep the header from being pushed outside a short 2-Split phone card.
        if (reference) {
          reference.style.flex = '0 0 auto';
          reference.style.minHeight = '0';
        }
      }

      function fitMirrorStageTo16x9(displayMode, outerMargin) {
        const viewport = document.getElementById('mirrorViewport');
        const footer = document.querySelector('footer');
        const MASTER_WIDTH = 1920;
        const MASTER_HEIGHT = 1080;

        // Orientation never changes the composition. Only the scale of this
        // landscape master frame changes to fit the available screen area.
        document.body.classList.remove('portrait-orientation', 'landscape-phone');

        const viewWidth = Math.max(1, window.innerWidth || document.documentElement.clientWidth || MASTER_WIDTH);
        const viewHeight = Math.max(1, window.innerHeight || document.documentElement.clientHeight || MASTER_HEIGHT);
        const footerHeight = footer ? Math.ceil(footer.getBoundingClientRect().height || 54) : 54;
        const contentHeight = Math.max(1, viewHeight - footerHeight);
        const frameScale = Math.max(0.01, Math.min(viewWidth / MASTER_WIDTH, contentHeight / MASTER_HEIGHT));

        // The stage is authored once at 1920x1080. CSS transform scales the
        // complete frame, including all slots, raster text and word hit areas.
        viewport.style.position = 'fixed';
        viewport.style.left = (viewWidth / 2) + 'px';
        viewport.style.top = (contentHeight / 2) + 'px';
        viewport.style.width = MASTER_WIDTH + 'px';
        viewport.style.height = MASTER_HEIGHT + 'px';
        viewport.style.flex = 'none';
        viewport.style.margin = '0';
        viewport.style.padding = '0';
        viewport.style.setProperty('--hl-frame-scale', String(frameScale));

        stage.style.width = MASTER_WIDTH + 'px';
        stage.style.height = MASTER_HEIGHT + 'px';
        stage.style.aspectRatio = '16 / 9';
        stage.style.setProperty('--canvas-width', MASTER_WIDTH + 'px');
        stage.style.setProperty('--canvas-height', MASTER_HEIGHT + 'px');

        // Keep split-card proportions identical to Output's 16:9 master layout.
        const gap = parseFloat(getComputedStyle(stage).gap) || 18;
        let slotScale = 1;
        if (displayMode === 2) {
          slotScale = Math.min((MASTER_WIDTH - gap) / (2 * MASTER_WIDTH), 1);
        } else if (displayMode === 3 || displayMode === 4) {
          slotScale = Math.min(
            (MASTER_WIDTH - gap) / (2 * MASTER_WIDTH),
            (MASTER_HEIGHT - gap) / (2 * MASTER_HEIGHT),
            1
          );
        }
        stage.style.setProperty('--slot-scale', String(Math.max(0.05, slotScale)));
      }

      function applyTypography(boxEl, fonts) {
        const outRefEl = boxEl.querySelector('.reference-title');
        const outVerEl = boxEl.querySelector('.version-subtitle');
        const outContentEl = boxEl.querySelector('.verse-text');
        const defaultFont = 'Arial, Helvetica, sans-serif';
        const f = fonts || {};

        if (outRefEl) {
          outRefEl.style.fontFamily = f.ref || defaultFont;
          outRefEl.style.fontWeight = f.refBold ? '700' : '400';
          outRefEl.style.fontStyle = f.refItalic ? 'italic' : 'normal';
        }
        if (outVerEl) {
          outVerEl.style.fontFamily = f.version || defaultFont;
          outVerEl.style.fontWeight = f.verBold ? '700' : '400';
          outVerEl.style.fontStyle = f.verItalic ? 'italic' : 'normal';
        }
        if (outContentEl) {
          outContentEl.style.fontFamily = f.content || defaultFont;
          outContentEl.style.fontWeight = f.contentBold !== false ? '700' : '400';
          outContentEl.style.fontStyle = f.contentItalic ? 'italic' : 'normal';
        }
      }

      // MAIN RENDER FUNCTION (MODE-SWITCH IMMUNE)
      function renderMirrorState(data) {
        if (!data || !Array.isArray(data.slots)) return;
        lastOutputData = data;

        const viewport = document.getElementById('mirrorViewport');
        if (data.bg === 'transparent') {
          viewport.style.backgroundColor = '#0b0f19';
          viewport.style.backgroundImage = 'radial-gradient(rgba(255,255,255,0.07) 1px, transparent 0)';
          viewport.style.backgroundSize = '24px 24px';
        } else if (data.bg && data.bg.startsWith('url')) {
          viewport.style.backgroundImage = data.bg;
          viewport.style.backgroundSize = 'cover';
          viewport.style.backgroundPosition = 'center';
        } else if (data.bg) {
          viewport.style.backgroundColor = data.bg;
          viewport.style.backgroundImage = 'none';
        }

        if (typeof data.hideVerseBox !== 'undefined') {
          document.body.classList.toggle('hide-verse-box-active', !!data.hideVerseBox);
          hiddenWarning.style.display = data.hideVerseBox ? 'inline' : 'none';
        }

        const s = data.settings || {};
        const pad = (s.boxPadding !== undefined) ? parseInt(s.boxPadding, 10) : 70;
        const outerMargin = (s.screenMargin !== undefined) ? parseInt(s.screenMargin, 10) : 39;
        const hideBoxBg = Boolean(s.hideBoxBg);
        const baseMaxFont = parseInt(s.maxFontSize, 10) || 72;
        const topGapPx = (s.topGap !== undefined) ? parseInt(s.topGap, 10) : 1;
        const displayMode = parseInt(data.displayMode, 10) || 1;
        const textSpacing = getOutputTextSpacing(s, displayMode);
        const modeChanged = (displayMode !== lastDisplayMode);
        lastDisplayMode = displayMode;

        document.documentElement.style.setProperty('--title-verse-gap', topGapPx + 'px');

        const modeLabels = { 1: '1 FULL (LIVE)', 2: '2 SPLIT (LIVE)', 3: '3 SPLIT (LIVE)', 4: '4 GRID (LIVE)' };
        modeBadge.textContent = modeLabels[displayMode] || (displayMode + ' MODE');

        stage.className = 'mode-' + displayMode;
        fitMirrorStageTo16x9(displayMode, outerMargin);
        const modeAdjustments = s.modeAdjustments || {};
        const modeAdjustment = modeAdjustments[displayMode] || {};
        const requestedZoomX = Number(modeAdjustment.zoomX);
        const requestedPanX = Number(modeAdjustment.panX);
        const requestedZoomY = Number(modeAdjustment.zoomY);
        const requestedPanY = Number(modeAdjustment.panY);
        // HIGHLIGHTER-ONLY OVERRIDE: keep this viewer at 100% X zoom.
        // Operator zoom values remain untouched and continue to control Output.
        const zoomX = 1;
        const panX = Math.min(400, Math.max(-400, Number.isFinite(requestedPanX) ? requestedPanX : 0));
        // HIGHLIGHTER-ONLY OVERRIDE: keep this viewer at 100% Y zoom.
        // This does not modify the Operator settings or output/output.html.
        const zoomY = 1;
        const panY = Math.min(400, Math.max(-400, Number.isFinite(requestedPanY) ? requestedPanY : 0));
        stage.style.setProperty('--slot-zoom-x', String(zoomX));
        stage.style.setProperty('--slot-zoom-x-inverse', String(1 / zoomX));
        stage.style.setProperty('--slot-zoom-x-width', (zoomX * 100) + '%');
        stage.style.setProperty('--slot-pan-x', panX + 'px');
        stage.style.setProperty('--slot-zoom-y', String(zoomY));
        stage.style.setProperty('--slot-zoom-y-inverse', String(1 / zoomY));
        stage.style.setProperty('--slot-pan-y', panY + 'px');

        // I-check muna ang LAHAT ng 4 slots para sa pagbabago ng salita kahit nakatago pa ang iba
        data.slots.slice(0, 4).forEach((slotData, idx) => {
          const wordsArr = Array.isArray(slotData.words) ? slotData.words : [];
          // Use the complete verse identity. Two different verses can contain
          // identical words; their highlight indexes must never leak into each other.
          const verseSig = [
            slotData.transId || '', slotData.bookIndex ?? '', slotData.chapter || '',
            slotData.verse || '', slotData.reference || '', slotData.version || '',
            wordsArr.join(' ')
          ].join('|').toLowerCase();
          const opHighArr = (Array.isArray(slotData.highlighted) ? slotData.highlighted : [])
            .map(Number).filter(wIdx => Number.isInteger(wIdx) && wIdx >= 0 && wIdx < wordsArr.length);
          const opHighSig = opHighArr.slice().sort((a,b) => a - b).join(',');

          if (slotVerseSignatures[idx] !== verseSig) {
            // A new verse (or an emptied slot) starts with the Operator's exact highlight state.
            slotVerseSignatures[idx] = verseSig;
            persistentHighlights[idx] = new Set(opHighArr);
            lastOperatorHighSig[idx] = opHighSig;
          } else if (opHighSig !== lastOperatorHighSig[idx]) {
            // Reconcile both additions AND removals from the Operator. Union-only
            // updates left stale words highlighted after a word was unselected.
            lastOperatorHighSig[idx] = opHighSig;
            persistentHighlights[idx] = new Set(opHighArr);
          }
        });

        const visibleSlots = data.slots.slice(0, displayMode);

        while (stage.children.length > visibleSlots.length) stage.removeChild(stage.lastChild);
        while (stage.children.length < visibleSlots.length) {
          const box = document.createElement('div');
          box.className = 'render-box';
          box.innerHTML = `
            <div class="slot-canvas">
              <div class="reference-container">
                <div class="reference-text-guard">
                  <div class="reference-title"></div>
                  <div class="version-subtitle"></div>
                </div>
                <span class="slot-indicator" style="font-size:12px; color:#94a3b8; font-weight:700;"></span>
              </div>
              <div class="verse-container">
                <div class="verse-text-guard">
                  <canvas class="verse-raster-canvas" aria-hidden="true"></canvas>
                  <div class="verse-text raster-hit-layer"></div>
                </div>
              </div>
            </div>
          `;
          stage.appendChild(box);
        }

        visibleSlots.forEach((slotData, sIdx) => {
          const boxEl = stage.children[sIdx];
          const canvasEl = boxEl.querySelector('.slot-canvas');
          if (canvasEl) {
            canvasEl.style.removeProperty('padding');
            if (displayMode === 1) {
              // 1 Full keeps its existing composition-based padding.
              canvasEl.style.padding = `${pad}px ${pad + 8}px`;
            } else {
              // HIGHLIGHTER-ONLY SPLIT DEFAULT: fixed 50px inner padding for
              // 2 Split, 3 Split and 4 Grid, independent of Output settings.
              // Inline !important also overrides the old responsive phone clamps.
              canvasEl.style.setProperty('padding', '50px', 'important');
            }
            canvasEl.style.borderRadius = outerMargin === 0 && displayMode === 1 ? '0px' : '14px';
          }
          boxEl.classList.toggle('transparent-verse-box', hideBoxBg);

          const refEl = boxEl.querySelector('.reference-title');
          const verEl = boxEl.querySelector('.version-subtitle');
          const indEl = boxEl.querySelector('.slot-indicator');
          const contentEl = boxEl.querySelector('.verse-text');

          refEl.textContent = slotData.reference || '';
          verEl.textContent = slotData.version || '';
          if (indEl) indEl.textContent = 'SLOT ' + (sIdx + 1);

          const wordsArr = slotData.words || [];
          const hasSpaces = slotData.hasSpaces !== false;

          const newVerseKey = (slotData.reference || '') + '|' + (slotData.version || '') + '|' + wordsArr.join(' ');
          if (contentEl.dataset.verseKey !== newVerseKey) {
            contentEl.dataset.verseKey = newVerseKey;
            contentEl.innerHTML = '';

            wordsArr.forEach((word, wIdx) => {
              const span = document.createElement('span');
              span.textContent = word;
              span.classList.add('ndi-word');
              span.dataset.idx = wIdx;

              span.dataset.slotIndex = sIdx;

              contentEl.appendChild(span);

              if (wIdx < wordsArr.length - 1 && hasSpaces) {
                const space = document.createElement('span');
                space.textContent = ' ';
                space.classList.add('ndi-space');
                space.dataset.spaceAfter = wIdx;
                contentEl.appendChild(space);
              }
            });
          }

          // Laging i-apply ang persistentHighlights para hindi mawala sa mode switch!
          updateWordVisuals(boxEl, sIdx);
          applyTypography(boxEl, data.fonts);
          // Deferred until the browser has completed the final slot/canvas layout.
        });

        // Fit each slot only after its 16:9 canvas has completed layout.
        // This prevents an early measurement from caching an oversized font.
        requestAnimationFrame(() => requestAnimationFrame(() => {
          if (lastOutputData !== data) return;
          visibleSlots.forEach((slotData, idx) => {
            const boxEl = stage.children[idx];
            if (boxEl) {
              adjustMirrorFontSize(boxEl, baseMaxFont, displayMode, data.fonts, textSpacing);
              scheduleRasterPaint(boxEl, idx);
            }
          });
        }));

        // Kung nagpalit ng mode ang Operator, ibalik agad sa Output screen ang mga highlights
        if (modeChanged) {
          setTimeout(() => rebroadcastActiveHighlights(displayMode), 60);
        }
      }

      // Tap = toggle one word. Press-and-hold (~190ms), then drag = paint/erase a word range.
      // Pointer events work consistently with mouse, pen, Android touch, and iOS touch.
      function getWordAtPoint(x, y) {
        const el = document.elementFromPoint(x, y);
        return el && el.closest ? el.closest('.ndi-word') : null;
      }

      function applyDragToWord(wordEl) {
        if (!dragHoldActivated || !wordEl) return;
        const slotIdx = Number(wordEl.dataset.slotIndex);
        const wordIdx = Number(wordEl.dataset.idx);
        if (slotIdx !== activeDragSlot || !Number.isInteger(wordIdx)) return;
        if (dragLastWordIndex === null || wordIdx === dragLastWordIndex) return;

        // Fill any words skipped by a fast swipe; word indexes are the canonical reading order.
        const from = dragLastWordIndex;
        const step = wordIdx > from ? 1 : -1;
        for (let idx = from + step; step > 0 ? idx <= wordIdx : idx >= wordIdx; idx += step) {
          setWordHighlight(slotIdx, idx, dragTargetHighlightState);
        }
        dragLastWordIndex = wordIdx;
      }

      stage.addEventListener('pointerdown', (e) => {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        const wordEl = e.target.closest && e.target.closest('.ndi-word');
        if (!wordEl) return;
        e.preventDefault();
        isPointerDown = true;
        activePointerId = e.pointerId;
        activeDragSlot = Number(wordEl.dataset.slotIndex);
        dragStartPoint = { slotIdx: activeDragSlot, wordIdx: Number(wordEl.dataset.idx), x: e.clientX, y: e.clientY };
        dragHoldActivated = false;
        dragLastWordIndex = null;
        if (dragHoldTimer) clearTimeout(dragHoldTimer);
        dragHoldTimer = setTimeout(activateHoldDrag, HOLD_TO_DRAG_MS);
      }, { passive: false });

      document.addEventListener('pointermove', (e) => {
        if (!isPointerDown || e.pointerId !== activePointerId) return;
        if (!dragHoldActivated && dragStartPoint) {
          const dx = e.clientX - dragStartPoint.x;
          const dy = e.clientY - dragStartPoint.y;
          if (Math.hypot(dx, dy) > MOVE_CANCEL_PX && e.pointerType === 'touch') {
            if (dragHoldTimer) clearTimeout(dragHoldTimer);
            dragHoldTimer = null;
          }
        }
        if (!dragHoldActivated) return;
        if (e.cancelable) e.preventDefault();
        applyDragToWord(getWordAtPoint(e.clientX, e.clientY));
      }, { passive: false });

      stage.addEventListener('pointerup', (e) => {
        if (!isPointerDown || e.pointerId !== activePointerId) return;
        if (dragHoldTimer) clearTimeout(dragHoldTimer);
        dragHoldTimer = null;
        if (!dragHoldActivated && dragStartPoint) {
          const { slotIdx, wordIdx } = dragStartPoint;
          setWordHighlight(slotIdx, wordIdx, !persistentHighlights[slotIdx].has(wordIdx));
        }
        finishPointerGesture();
      });

      // CLEAR ALL HIGHLIGHTS
      document.getElementById('btnClearHighlights').addEventListener('click', () => {
        for (let i = 0; i < 4; i++) persistentHighlights[i].clear();
        stage.querySelectorAll('.active-highlight').forEach(el => el.classList.remove('active-highlight'));
        Array.from(stage.children).forEach((boxEl, idx) => scheduleRasterPaint(boxEl, idx));

        const payload = {
          type: 'CLEAR_ALL_HIGHLIGHTS',
          __msgId: Date.now() + '_clear'
        };

        fetch('/api/output-broadcast', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        }).catch(() => {});

        fetch('/api/pastor-tap', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        }).catch(() => {});

        syncHighlightsToStorage();
      });

      // FULLSCREEN BUTTON
      document.getElementById('btnFullscreen').addEventListener('click', () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      });

      // 1. SSE Output Stream Listener (LAN / Tablet)
      function connectOutputStream() {
        const es = new EventSource('/api/output-stream');
        es.onopen = () => {
          dotStatus.style.background = '#22c55e';
          dotStatus.style.boxShadow = '0 0 10px #22c55e';
        };
        es.onmessage = (e) => {
          if (!e.data) return;
          try {
            const msg = JSON.parse(e.data);
            if (msg.type === 'SET_SLOT_HIGHLIGHT') {
              const sIdx = msg.slotIndex;
              if (msg.isHighlighted) persistentHighlights[sIdx].add(msg.wordIndex);
              else persistentHighlights[sIdx].delete(msg.wordIndex);
              if (stage.children[sIdx]) updateWordVisuals(stage.children[sIdx], sIdx);
              return;
            }
            if (msg.type === 'CLEAR_ALL_HIGHLIGHTS' || msg.type === 'CLEAR_HIGHLIGHTS') {
              for (let i = 0; i < 4; i++) persistentHighlights[i].clear();
              stage.querySelectorAll('.active-highlight').forEach(el => el.classList.remove('active-highlight'));
              Array.from(stage.children).forEach((boxEl, idx) => scheduleRasterPaint(boxEl, idx));
              return;
            }
            if (typeof msg.hideVerseBox !== 'undefined' && !msg.slots) {
              document.body.classList.toggle('hide-verse-box-active', !!msg.hideVerseBox);
              hiddenWarning.style.display = msg.hideVerseBox ? 'inline' : 'none';
              return;
            }
            if (Array.isArray(msg.slots)) {
              renderMirrorState(msg);
            }
          } catch (err) {}
        };
        es.onerror = () => {
          dotStatus.style.background = '#ef4444';
          dotStatus.style.boxShadow = '0 0 10px #ef4444';
          es.close();
          setTimeout(connectOutputStream, 2000);
        };
      }
      connectOutputStream();

      // 2. WebSocket Listener
      function connectLiveSocket() {
        const wsHost = window.location.host || 'localhost:5000';
        const ws = new WebSocket((window.location.protocol === 'https:' ? 'wss://' : 'ws://') + wsHost);
        ws.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);
            if (Array.isArray(data.slots)) renderMirrorState(data);
          } catch (e) {}
        };
        ws.onclose = () => setTimeout(connectLiveSocket, 2000);
        ws.onerror = () => ws.close();
      }
      connectLiveSocket();

      // 3. LocalStorage & BroadcastChannel Fallbacks
      if (bcLive) {
        bcLive.onmessage = (e) => {
          if (e.data && Array.isArray(e.data.slots)) renderMirrorState(e.data);
        };
      }
      window.addEventListener('storage', (e) => {
        if (e.key === 'bible_live_payload' && e.newValue) {
          try { renderMirrorState(JSON.parse(e.newValue)); } catch (err) {}
        }
      });

      const savedInit = localStorage.getItem('bible_live_payload');
      if (savedInit) {
        try { renderMirrorState(JSON.parse(savedInit)); } catch (err) {}
      }

      let fitResizeFrame = 0;
      const fitObserver = new ResizeObserver(() => {
        cancelAnimationFrame(fitResizeFrame);
        fitResizeFrame = requestAnimationFrame(() => {
          if (lastOutputData) renderMirrorState(lastOutputData);
        });
      });
      fitObserver.observe(document.getElementById('mirrorViewport'));
      window.addEventListener('resize', () => {
        if (lastOutputData) renderMirrorState(lastOutputData);
      });
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', () => {
          if (lastOutputData) renderMirrorState(lastOutputData);
        });
      }
      window.addEventListener('orientationchange', () => {
        setTimeout(() => { if (lastOutputData) renderMirrorState(lastOutputData); }, 180);
      });
    })();
  </script>
</body>
</html>
